# st4sh-scripts as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `st4sh_scripts-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "1a882ea1-5f83-49eb-ba1f-728d90ee1a2d"
slug = "st4sh_scripts"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.st4sh-scripts"

[[releases]]
version = "0.1.1"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
