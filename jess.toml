manifest_version = 1

[package]
id = "org.dreamweave.st4sh-scripts"
version = "0.1.1"
jess_api = "1"
include = ["src", "assets", "LICENSES", "README.md", "tests"]
tests = ["tests/masks.jsl", "tests/morrowind.jsl", "tests/artwork.jsl", "tests/cli.jsl"]

[dependencies]
"org.dreamweave.magick" = "^0.1.2"

[modules]
"@st4sh/scripts" = "src/init.jsl"
"@st4sh/scripts.cli" = "src/cli.jsl"
"@st4sh/scripts.atlas" = "src/atlas.jsl"
"@st4sh/scripts.morrowind-ui" = "src/morrowind_ui.jsl"
"@st4sh/scripts.morrowind-fucked" = "src/morrowind_fucked.jsl"
"@st4sh/scripts.morrowind-font-masks" = "src/morrowind_font_masks.jsl"
"@st4sh/scripts.morrowind-spiral-masks" = "src/morrowind_spiral_masks.jsl"
"@st4sh/scripts.morrowind-oracle-masks" = "src/morrowind_oracle_masks.jsl"
"@st4sh/scripts.h3" = "src/h3.jsl"
"@st4sh/scripts.h3-masks" = "src/h3_masks.jsl"
"@st4sh/scripts.cod3x" = "src/cod3x.jsl"
"@st4sh/scripts.cod3x-masks" = "src/cod3x_masks.jsl"
"@st4sh/scripts.material-variants" = "src/material_variants.jsl"

[[layer]]
id = "org.dreamweave.st4sh-scripts"
requires = ["org.dreamweave.magick"]
exports = [
  "@st4sh/scripts",
  "@st4sh/scripts.cli",
  "@st4sh/scripts.atlas",
  "@st4sh/scripts.morrowind-ui",
  "@st4sh/scripts.morrowind-fucked",
  "@st4sh/scripts.morrowind-font-masks",
  "@st4sh/scripts.morrowind-spiral-masks",
  "@st4sh/scripts.morrowind-oracle-masks",
  "@st4sh/scripts.h3",
  "@st4sh/scripts.h3-masks",
  "@st4sh/scripts.cod3x",
  "@st4sh/scripts.cod3x-masks",
  "@st4sh/scripts.material-variants",
]
